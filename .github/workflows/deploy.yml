name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Project
        run: npm run docs:build

      - name: Deploy via Password Script
        run: |
          # 1. 在本地打包 dist 目录
          cd docs/.vitepress/dist
          tar czf /tmp/dist.tar.gz .
          
          # 2. 通过 scp 传输压缩包到服务器
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/dist.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/
          
          # 3. 在服务器上解压到目标目录
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p \"${{ secrets.SERVER_TARGET }}\" && tar xzf /tmp/dist.tar.gz -C \"${{ secrets.SERVER_TARGET }}\" && rm /tmp/dist.tar.gz"
