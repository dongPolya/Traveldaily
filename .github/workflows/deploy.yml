name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装依赖（本项目使用 npm）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: npm install --no-frozen-lockfile

      # 4. 构建网站
      - name: Build Project
        run: npm run docs:build

      # 5. 调试步骤（验证密钥是否正确传递）
      - name: Debug SSH Key
        run: |
          echo "=== Debug SSH Key ==="
          echo "Key length:"
          echo "${{ secrets.SERVER_SSH_KEY }}" | wc -c
          echo "First line:"
          echo "${{ secrets.SERVER_SSH_KEY }}" | head -n 1
          echo "Last line:"
          echo "${{ secrets.SERVER_SSH_KEY }}" | tail -n 1

      # 6. 部署到服务器
      - name: Manual Deploy via SSH (SCP)
        run: |
          cp deploy_key /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/deploy_key -r docs/.vitepress/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_TARGET }}
