name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Project
        run: npm run docs:build

      - name: Deploy via Password Script
        run: |
          cat > /tmp/deploy.sh << 'EOF'
          #!/bin/bash
          set -x
          DEST="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/www/wwwroot/47.83.18.133_18040/"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r docs/.vitepress/dist/* "$DEST"
          EOF
          chmod +x /tmp/deploy.sh
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" /tmp/deploy.sh
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
