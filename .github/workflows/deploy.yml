name: Deploy to Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Project
        run: npm run docs:build

      - name: Deploy via tar with Password
        run: |
          # 1. 安装 sshpass
          sudo apt-get update
          sudo apt-get install -y sshpass

          # 2. 进入构建目录并打包
          cd docs/.vitepress/dist
          tar -czf /tmp/website.tar.gz .

          # 3. 传输压缩包（密码通过环境变量传递）
          export SSHPASS="${{ secrets.SERVER_PASSWORD }}"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/website.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/

          # 4. 在服务器上解压（密码同样通过环境变量传递）
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ${{ secrets.SERVER_TARGET }} && tar -xzf /tmp/website.tar.gz -C ${{ secrets.SERVER_TARGET }} && rm /tmp/website.tar.gz"
